---
services:
  anewdawn:
    container_name: anewdawn
    image: git.lovinator.space/thelovinator/anewdawn:latest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN?DISCORD_TOKEN is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY?DEEPSEEK_API_KEY is required}
      DATA_DIR: /app/data
    volumes:
      - anewdawn_data:/app/data

volumes:
  anewdawn_data:
